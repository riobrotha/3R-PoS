version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: pos-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user_db
      POSTGRES_PASSWORD: password_db
      POSTGRES_DB: name_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
